<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Storm Hex Map</title>
<meta name="description" content="PRISM storm precipitation averaged into H3 hexagons and extruded by depth, for any run of days." />
<link href="/fonts/fonts.css" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>
  :root {
    --bg: #f4efe6; --surface: rgba(251, 248, 242, 0.94); --text: #2a2420; --muted: #6e6359;
    --line: #ddd3c2; --accent: #9a4f1d; --accent-ink: #ffffff; --bar: #c9bba6;
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1613; --surface: rgba(34, 29, 25, 0.94); --text: #ede6dc; --muted: #ab9f92;
      --line: #3a322b; --accent: #e3995f; --accent-ink: #20120a; --bar: #574b40;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1613; --surface: rgba(34, 29, 25, 0.94); --text: #ede6dc; --muted: #ab9f92;
    --line: #3a322b; --accent: #e3995f; --accent-ink: #20120a; --bar: #574b40;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-sans); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; left: 12px; top: 12px; z-index: 2; box-sizing: border-box; width: min(380px, calc(100% - 24px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.08);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  /* Daily basin means as bars, one per PRISM day, lined up with the slider stops below them. */
  .range { --n: 1; --thumb: 16px; margin: 4px 0 2px; }
  .bars { display: flex; align-items: flex-end; height: 44px; gap: 2px; }
  .bars button {
    flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; cursor: pointer;
    display: flex; align-items: flex-end;
  }
  .bars span { display: block; width: 100%; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 1px; }
  .bars button.in span { background: var(--accent); }
  .bars button:hover span { opacity: .75; }
  .slider { position: relative; height: 22px; }
  .slider .track {
    position: absolute; top: 9px; height: 4px; border-radius: 2px; background: var(--line);
    left: calc(50% / var(--n)); right: calc(50% / var(--n));
  }
  .slider .fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
  /* Two range inputs on one track; only their thumbs take the pointer. The inputs are inset so each stop sits
     under the center of its day's bar. */
  .slider input {
    position: absolute; top: 0; margin: 0; height: 22px; background: none; pointer-events: none;
    -webkit-appearance: none; appearance: none;
    left: calc(50% / var(--n) - var(--thumb) / 2); width: calc(100% - 100% / var(--n) + var(--thumb));
  }
  .slider input::-webkit-slider-runnable-track { background: none; height: 22px; }
  .slider input::-moz-range-track { background: none; }
  .slider input::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; cursor: grab; width: var(--thumb); height: var(--thumb);
    margin-top: 3px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-sizing: border-box;
  }
  .slider input::-moz-range-thumb {
    pointer-events: auto; cursor: grab; width: var(--thumb); height: var(--thumb); border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent); box-sizing: border-box;
  }
  .slider input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  .slider input:focus-visible::-moz-range-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ticks { position: relative; height: 14px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .picked { font-size: 13px; font-weight: 600; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
  .picked small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .presets button {
    font: 12px var(--font-sans); color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px; cursor: pointer;
  }
  .presets button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .note { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; }
  .stat { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); margin: 0 0 8px; }
  .stat b { color: var(--text); font-weight: 600; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .ramp { flex: 1; height: 8px; border-radius: 4px; }
  .hint { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
  .show { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .show label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .show input { accent-color: var(--accent); margin: 0; }
  .tip {
    position: absolute; z-index: 3; pointer-events: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; display: none; white-space: nowrap;
  }
  .tip b { font-weight: 600; }
  /* ?still: no panel or controls, for making a still image of the view. */
  .still .panel, .still .maplibregl-ctrl { display: none; }
  @media (max-width: 700px) {
    .panel { padding: 9px 11px; width: calc(100% - 64px); }
    .sub, .hint, .note { display: none; }
    h1 { font-size: 13px; }
    .bars { height: 30px; }
    .picked { margin: 5px 0 4px; font-size: 12px; }
    .presets { gap: 3px; margin-bottom: 5px; }
    .presets button { padding: 2px 6px; font-size: 11px; }
    .stat { font-size: 11px; margin-bottom: 5px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1 id="title"></h1>
  <p class="sub">PRISM 800 m precipitation averaged into H3 hexagons (resolution 6, about 36 km² each). Height and color show depth over the days you choose.</p>
  <div class="range" id="range">
    <div class="bars" id="bars" aria-hidden="true"></div>
    <div class="slider">
      <div class="track"><div class="fill" id="fill"></div></div>
      <input type="range" id="from" min="0" step="1" aria-label="First day" />
      <input type="range" id="to" min="0" step="1" aria-label="Last day" />
    </div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </div>
  <p class="picked" id="picked" aria-live="polite"></p>
  <div class="presets" id="presets" role="group" aria-label="Storm windows"></div>
  <p class="stat" id="stat"></p>
  <p class="note" id="day-note"></p>
  <div class="legend"><span id="lo">0</span><div class="ramp" id="ramp"></div><span id="hi"></span></div>
  <div class="show">
    <label><input type="checkbox" name="towns" checked /> Towns</label>
    <label><input type="checkbox" name="rivers" checked /> Rivers</label>
  </div>
  <p class="hint">Drag the handles, or click a day's bar. Drag the map to pan, right-drag or Ctrl-drag to tilt and rotate, and scroll to zoom.</p>
</div>
<div class="tip" id="tip"></div>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const still = params.has('still');
  if (still) document.body.classList.add('still');
  const data = await (await fetch('data.json')).json();
  document.title = data.title;
  document.getElementById('title').textContent = data.title;
  const n = data.days.length;
  // Shrink each hex toward its center so neighboring columns read separately.
  data.hexes.forEach(h => {
    const cx = h[4].reduce((s, p) => s + p[0], 0) / h[4].length, cy = h[4].reduce((s, p) => s + p[1], 0) / h[4].length;
    h[4] = h[4].map(([x, y]) => [cx + (x - cx) * 0.9, cy + (y - cy) * 0.9]);
  });
  // Running sums of each hex's daily depth (h[1]) and rain depth (h[7]), so any run of days is one subtraction.
  const prefix = a => a.reduce((c, v, i) => (c[i + 1] = c[i] + v, c), new Float64Array(a.length + 1));
  const cum = data.hexes.map(h => prefix(h[1]));
  const rainCum = data.rain_snow ? data.hexes.map(h => prefix(h[7])) : null;
  const areaM2 = data.hexes.reduce((s, h) => s + h[6], 0);

  // YlGnBu, light to dark: low precipitation pale, high deep blue.
  const RAMP = [[255,255,204],[199,233,180],[127,205,187],[65,182,196],[29,145,192],[34,94,168],[12,44,132]];
  document.getElementById('ramp').style.background =
    'linear-gradient(90deg,' + RAMP.map(c => `rgb(${c})`).join(',') + ')';
  const color = (v, max) => {
    const t = Math.min(1, Math.max(0, v / max)) * (RAMP.length - 1);
    const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i;
    return RAMP[i].map((c, j) => Math.round(c + (RAMP[i + 1][j] - c) * f)).concat(235);
  };

  const dark = () => document.documentElement.dataset.theme === 'dark' ||
    (document.documentElement.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const style = () => dark()
    ? 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
    : 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';

  const fmtDay = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  // "Oct 22", "Oct 22–25", or "Oct 30–Nov 2" across a month end.
  const span = (a, b) => {
    const [x, y] = [fmtDay(data.days[a]), fmtDay(data.days[b])];
    return a === b ? x : x.split(' ')[0] === y.split(' ')[0] ? `${x}–${y.split(' ')[1]}` : `${x}–${y}`;
  };
  const fmt = (v, d) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const af = m3 => { const v = m3 / 1233.48184; return v >= 1e6 ? `${fmt(v / 1e6, 2)} million acre-feet` : `${fmt(v, 0)} acre-feet`; };
  const km3 = m3 => `${fmt(m3 / 1e9, m3 >= 1e9 ? 3 : 4)} km³`;
  const dayMean = i => data.daily_stats?.[i] ? data.daily_stats[i][0] : data.hexes.reduce((s, h) => s + h[1][i] * h[6], 0) / areaM2;

  // The selected run of days, from ?start=&end= (ISO dates), else the config's initial window, else every day.
  const at = d => data.days.indexOf(d);
  let [a, b] = [0, n - 1];
  const init = params.has('start') ? [params.get('start'), params.get('end') ?? params.get('start')] : data.initial;
  if (init && at(init[0]) >= 0 && at(init[1]) >= at(init[0])) [a, b] = [at(init[0]), at(init[1])];

  const depth = k => cum[k][b + 1] - cum[k][a];
  // The run's named events (storm.toml) that exactly match the selection, for its own figures and uncertainty range.
  const event = () => data.events?.find(e => e.start === data.days[a] && e.end === data.days[b]);

  // Keep the basin clear of the panel: beside it on wide screens, below it on narrow ones.
  const panel = document.querySelector('.panel').getBoundingClientRect();
  const wide = innerWidth > 700;
  const padding = still ? { top: 90, bottom: 30, left: 40, right: 70 }
    : wide ? { top: 90, bottom: 30, left: panel.right + 20, right: 70 }
    : { top: panel.bottom + 10, bottom: 20, left: 20, right: 50 };
  const map = new maplibregl.Map({
    container: 'map', style: style(), attributionControl: { compact: true },
    bounds: data.bounds, pitch: data.view.pitch ?? 50, bearing: data.view.bearing ?? 0, antialias: true,
    fitBoundsOptions: { padding },
    // Embedded in a page, let the page scroll: zoom with Ctrl or Cmd + scroll, pan with two fingers.
    cooperativeGestures: window.self !== window.top,
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  const overlay = new deck.MapboxOverlay({ interleaved: false, layers: [] });
  map.addControl(overlay);

  function info(max) {
    const days = b - a + 1, e = event(), s = e?.summary;
    const picked = document.getElementById('picked');
    picked.replaceChildren(span(a, b) + (e ? ` · ${e.label}` : ''), ' ');
    const small = document.createElement('small');
    small.textContent = days === 1 ? '1 PRISM day' : `${days} PRISM days`;
    picked.appendChild(small);
    // Totals for any run of days come from the hexes (daily depth x area in the basin), which add up to the run's
    // own volume; a named event's figures come from the run's basin summary, as in the QGIS project and the report.
    const vol = data.hexes.reduce((t, h, k) => t + depth(k) * h[6], 0) / 1000;
    const all = data.hexes.reduce((t, h, k) => t + (cum[k][n] - cum[k][0]) * h[6], 0) / 1000;
    const lines = [[`Total precipitation: `, km3(s ? s.volume_m3 : vol), ` · ${af(s ? s.volume_m3 : vol)}`]];
    if (e?.range_m3) lines.push([`Uncertainty range ${fmt(e.range_m3[0] / 1e9, 2)}–${fmt(e.range_m3[1] / 1e9, 2)} km³`]);
    const d = days === 1 ? data.daily_stats?.[a] : null;
    lines.push(s ? [`Basin mean ${fmt(s.mean_mm, 1)} mm · cell max ${fmt(s.max_mm, 1)} mm`]
      : d ? [`Basin mean ${fmt(d[0], 1)} mm · cell max ${fmt(d[1], 1)} mm`]
      : [`Basin mean ${fmt(vol / areaM2 * 1000, 1)} mm · wettest hex ${fmt(max, 1)} mm`]);
    if (rainCum && vol > 0) {
      const rain = data.hexes.reduce((t, h, k) => t + (rainCum[k][b + 1] - rainCum[k][a]) * h[6], 0) / 1000;
      const r = Math.round(100 * (e?.rain_m3 ?? rain) / (s ? s.volume_m3 : vol));
      lines.push([`Rain ${r}% · snow ${100 - r}% (all snow at ${data.rain_snow[0]} °C, all rain at ${data.rain_snow[1]} °C)`]);
    }
    const share = all > 0 ? Math.round(100 * vol / all) : 100;
    if (share < 100) lines.push([`${share}% of the precipitation in all ${n} days`]);
    const sum = s ?? data.events?.find(x => x.summary)?.summary ?? data.summary;
    if (sum) lines.push([`Basin area: ${fmt(sum.area_km2, 0)} km² (HUC ${sum.huc})`]);
    const stat = document.getElementById('stat');
    stat.replaceChildren(...lines.flatMap((parts, k) => [...(k ? [document.createElement('br')] : []),
      ...parts.map((t, j) => { if (k || j !== 1) return t; const el = document.createElement('b'); el.textContent = t; return el; })]));
    // PRISM revises recent days for about six months (releases 1-8); say when the selection is still early.
    const rel = data.daily_stats?.slice(a, b + 1).map(x => x?.[2] ?? 0).filter(r => r > 0) ?? [];
    const lo = Math.min(...rel), hi = Math.max(...rel);
    const releases = rel.length && lo < 8
      ? ` PRISM release ${lo === hi ? lo : `${lo}–${hi}`} of 8: early estimates that PRISM revises for about six months.` : '';
    document.getElementById('day-note').textContent = data.day_note + releases;
  }

  const tip = document.getElementById('tip');
  function layers() {
    const depths = data.hexes.map((h, k) => depth(k)), wettest = Math.max(...depths);
    const max = Math.max(5, wettest);
    document.getElementById('hi').textContent = Math.round(max) + ' mm';
    info(wettest);
    // The tallest column stays about 100 km high, but a light day never gets more than the single-day scale.
    const elevationScale = Math.min(1200, 100000 / max);
    // Height of the column top under a point (h = hex index, -1 outside the basin), plus a lift so lines and
    // labels sit on the top instead of in it.
    const top = (h, lift) => (h >= 0 ? depths[h] * elevationScale : 0) + lift;
    const ink = dark() ? [237, 230, 220] : [42, 36, 32], halo = dark() ? [26, 22, 19] : [255, 255, 255];
    const key = `${a}-${b}`;
    return [
      new deck.GeoJsonLayer({
        id: 'basin', data: { type: 'Feature', geometry: data.basin }, stroked: true, filled: false,
        getLineColor: dark() ? [227, 153, 95, 220] : [154, 79, 29, 220], lineWidthMinPixels: 1.5,
      }),
      // Hex outlines come precomputed in data.json (h[4]), so no H3 library is needed here.
      new deck.PolygonLayer({
        id: 'hex', data: data.hexes, getPolygon: h => h[4], extruded: true, stroked: false,
        elevationScale, getElevation: (h, { index }) => depths[index],
        getFillColor: (h, { index }) => color(depths[index], max), pickable: true, autoHighlight: true,
        highlightColor: [154, 79, 29, 200], material: { ambient: 0.55, diffuse: 0.6, shininess: 24 },
        transitions: { getElevation: 300, getFillColor: 300 },
        updateTriggers: { getElevation: key, getFillColor: [key, max] },
        onHover: ({ object, index, x, y }) => {
          if (!object) { tip.style.display = 'none'; return; }
          const v = depths[index], m3 = v * object[6] / 1000;
          const rain = rainCum && v > 0 ? `, ${Math.round(100 * (rainCum[index][b + 1] - rainCum[index][a]) / v)}% rain` : '';
          tip.innerHTML = `<b>${v.toFixed(1)} mm</b> ${a === b ? 'on' : 'over'} ${span(a, b)}` +
            `<br>${(m3 / 1e6).toFixed(1)} million m³ of water${rain}`;
          tip.style.display = 'block'; tip.style.left = (x + 12) + 'px'; tip.style.top = (y + 12) + 'px';
        },
      }),
      // Rivers ride on the column tops: a dark casing under a white line reads on every color of the ramp.
      ...(show.rivers ? [
        new deck.PathLayer({
          id: 'rivers-casing', data: riverPaths, getPath: r => r.path.map(([x, y, h]) => [x, y, top(h, 120)]),
          getColor: [12, 44, 132, 230], getWidth: 4, widthUnits: 'pixels', capRounded: true, jointRounded: true,
          updateTriggers: { getPath: key },
        }),
        new deck.PathLayer({
          id: 'rivers', data: riverPaths, getPath: r => r.path.map(([x, y, h]) => [x, y, top(h, 120)]),
          getColor: [255, 255, 255, 240], getWidth: 1.6, widthUnits: 'pixels', capRounded: true, jointRounded: true,
          updateTriggers: { getPath: key },
        }),
        new deck.TextLayer({
          id: 'river-names', data: data.rivers.filter(r => r[2]), getText: r => r[0],
          getPosition: r => [r[2][0], r[2][1], top(r[2][2], 1500)], getSize: 11.5, fontFamily: 'Inter, sans-serif',
          fontWeight: 600, getColor: [255, 255, 255], outlineWidth: 6, outlineColor: [12, 44, 132, 235],
          fontSettings: { sdf: true, buffer: 8 }, parameters: { depthCompare: 'always' },
          updateTriggers: { getPosition: key },
        }),
      ] : []),
      // Towns are drawn over everything, so a tall column never hides one.
      ...(show.towns ? [
        new deck.ScatterplotLayer({
          id: 'towns', data: data.towns, getPosition: t => [t[1], t[2], top(t[3], 200)], getRadius: 3.5,
          radiusUnits: 'pixels', getFillColor: ink, stroked: true, getLineColor: halo, lineWidthMinPixels: 1.5,
          parameters: { depthCompare: 'always' }, updateTriggers: { getPosition: key, getFillColor: dark() },
        }),
        new deck.TextLayer({
          id: 'town-names', data: data.towns, getText: t => t[0], getPosition: t => [t[1], t[2], top(t[3], 200)],
          getSize: 13, fontFamily: 'Inter, sans-serif', fontWeight: 600, getColor: ink, outlineWidth: 6,
          outlineColor: halo.concat(235), fontSettings: { sdf: true, buffer: 8 },
          getTextAnchor: t => PLACE[t[4]].anchor, getAlignmentBaseline: t => PLACE[t[4]].baseline,
          getPixelOffset: t => PLACE[t[4]].offset, parameters: { depthCompare: 'always' },
          updateTriggers: { getPosition: key, getColor: dark() },
        }),
      ] : []),
    ];
  }
  // One entry per river reach, each a path of [lng, lat, hex index].
  const riverPaths = data.rivers.flatMap(([name, reaches]) => reaches.map(path => ({ name, path })));
  // ?bare hides towns and rivers, e.g. for a small thumbnail.
  const show = { towns: !params.has('bare'), rivers: !params.has('bare') };
  // Town names sit right of the dot, or above or below it where the config moves them off a neighbor (t[4]).
  const PLACE = {
    right: { anchor: 'start', baseline: 'center', offset: [7, 0] },
    above: { anchor: 'middle', baseline: 'bottom', offset: [0, -6] },
    below: { anchor: 'middle', baseline: 'top', offset: [0, 10] },
  };
  document.querySelectorAll('.show input').forEach(box => box.onchange = () => {
    show[box.name] = box.checked; overlay.setProps({ layers: layers() });
  });

  // The date range control: one bar per day (its basin mean), two handles on one track, and the run's events.
  const range = document.getElementById('range'), from = document.getElementById('from'), to = document.getElementById('to');
  range.style.setProperty('--n', n);
  [from, to].forEach(x => { x.max = n - 1; });
  const bars = document.getElementById('bars'), means = data.days.map((d, i) => dayMean(i));
  const wettestDay = Math.max(...means);
  data.days.forEach((d, i) => {
    const bar = document.createElement('button');
    bar.title = `${fmtDay(d)}: basin mean ${fmt(means[i], 1)} mm`; bar.tabIndex = -1;
    const fill = document.createElement('span'); fill.style.height = `${Math.max(2, 100 * means[i] / wettestDay)}%`;
    bar.appendChild(fill);
    bar.onclick = () => set(i, i);
    bars.appendChild(bar);
  });
  // Ticks at the first and last days and at each month's first day.
  const ticks = document.getElementById('ticks');
  data.days.forEach((d, i) => {
    if (!(i === 0 || i === n - 1 || d.endsWith('-01'))) return;
    const t = document.createElement('span'); t.textContent = fmtDay(d);
    t.style.left = i === 0 ? '0' : i === n - 1 ? '100%' : `${100 * (i + 0.5) / n}%`;
    ticks.appendChild(t);
  });
  const presets = document.getElementById('presets');
  const choices = (data.events ?? []).map(e => ({ label: e.label, a: at(e.start), b: at(e.end) }))
    .concat([{ label: `All ${n} days`, a: 0, b: n - 1 }])
    .filter((c, k, all) => all.findIndex(o => o.a === c.a && o.b === c.b) === k);
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.label; btn.onclick = () => set(c.a, c.b); c.el = btn;
    presets.appendChild(btn);
  });

  let pending = 0, urlTimer = 0;
  function set(x, y) {
    [a, b] = [x, y];
    from.value = a; to.value = b;
    from.setAttribute('aria-valuetext', fmtDay(data.days[a])); to.setAttribute('aria-valuetext', fmtDay(data.days[b]));
    const fill = document.getElementById('fill');
    fill.style.left = `${100 * a / Math.max(1, n - 1)}%`; fill.style.right = `${100 * (n - 1 - b) / Math.max(1, n - 1)}%`;
    bars.querySelectorAll('button').forEach((el, i) => el.classList.toggle('in', i >= a && i <= b));
    choices.forEach(c => c.el.setAttribute('aria-pressed', String(c.a === a && c.b === b)));
    // Redraw once per frame while a handle is dragged.
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => overlay.setProps({ layers: layers() }));
    // Keep the address shareable: ?start=&end= opens on this window.
    clearTimeout(urlTimer);
    urlTimer = setTimeout(() => {
      const q = new URLSearchParams(location.search);
      q.set('start', data.days[a]); q.set('end', data.days[b]);
      history.replaceState(null, '', `${location.pathname}?${q}`);
    }, 400);
  }
  // Which end a drag moves. Each handle moves its own end, except where both sit on one day (after a bar click,
  // say): then the first step decides, left for the first day and right for the last, whichever handle is on top.
  let grab = null;
  const move = (end, v) => {
    grab ??= a === b ? (v < a ? 'a' : 'b') : end;
    if (grab === 'a') set(Math.min(v, b), b); else set(a, Math.max(v, a));
  };
  from.oninput = () => move('a', +from.value);
  to.oninput = () => move('b', +to.value);
  // Start every drag fresh. 'change' alone can't be relied on to clear grab: it doesn't fire when a drag ends on
  // the value it started from (a nudge, or a handle pushed against the other and clamped back), and a stale grab
  // made the next drag move the wrong end. The keyboard always moves the handle that has focus.
  const release = () => { grab = null; };
  [from, to].forEach(x => {
    x.addEventListener('pointerdown', release);
    x.addEventListener('keydown', () => { grab = x === from ? 'a' : 'b'; });
    x.addEventListener('keyup', release);
    x.addEventListener('change', release);
  });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  set(a, b);

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    map.setStyle(style()); overlay.setProps({ layers: layers() });
  });
})();
</script>
</body>
</html>
