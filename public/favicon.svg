<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Animas River through Durango and a block of streets: a bold version of the header logo, which is too detailed to read at 16 px. -->
  <style>
    /* Field Notes colours: surface, spruce-green accent, rust river, as in the header logo */
    .disc { fill: #fffdf8; }
    .ring { fill: none; stroke: #2f6b4f; stroke-width: 1.8; }
    .grid { fill: none; stroke: #5b655f; stroke-width: .8; opacity: .55; }
    .river { fill: none; stroke: #b4532a; stroke-width: 3; stroke-linecap: round; }
